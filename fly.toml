# fly.toml — Michels Travel Agency
# Gerado para migração do Render → Fly.io (free tier)
# Região: iad (Virginia, US East — próximo a New Jersey)

app = "michelstravel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://www.michelstravel.agency"
  GITHUB_CALLBACK_URL = "https://www.michelstravel.agency/api/auth/github/callback"
  SMTP_PORT = "587"
  AI_PROVIDER = "auto"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
