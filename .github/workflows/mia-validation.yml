name: Mia 2027 - validation

on:
  pull_request:
    branches: [redesign-2027]
    paths:
      - 'client/src/components/Chatbot.tsx'
      - 'client/src/hooks/use-mia-voice.ts'
      - 'client/src/hooks/use-mia-realtime.ts'
      - 'server/routes/mia_realtime.ts'
      - 'server/routes/mia_realtime.test.ts'
      - 'src/index.ts'
      - 'wrangler.jsonc'
      - 'docs/mia-realtime-pilot.md'
      - 'server/services/serviceAi.ts'
      - '.github/workflows/mia-validation.yml'
  push:
    branches: [mia-2027-concierge]

permissions:
  contents: read

concurrency:
  group: mia-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run audit
      - name: Voice route regression (isolated upstream, NOT live voice QA)
        run: npx --no-install tsx --test server/routes/mia_realtime.test.ts
